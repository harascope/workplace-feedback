[project]
name = "workplace-feedback-api"
version = "0.1.0"
description = "職場フィードバックの匿名伝達デモのバックエンド"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "google-genai>=2.22",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "httpx>=0.28",
    "ruff>=0.14",
    "aiosqlite>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
