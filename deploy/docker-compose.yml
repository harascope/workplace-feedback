# gpa-prod VM の /opt/workplace-feedback/ に置く（deploy/deploy.sh が転送する）。
# TAG は同じディレクトリの .env から読む（deploy/deploy.sh が書く）。
# 起動は必ず `docker compose -p workplace-feedback up -d`。
# プロジェクト名を省くとディレクトリ名から決まり、相乗りしている他のアプリと衝突する。
#
# サービス名 feedback は web コンテナ。cloudflared ingress が `feedback:3000` を参照しているので、
# 3層構成にしてもこの名前は変えない（README「デプロイ」参照。ingress 側の変更は不要）。
# api と db はこのプロジェクト専用の内部ネットワーク（default）だけに置き、
# gpa_default（他アプリと相乗りのネットワーク）には出さない。
services:
  feedback:
    image: workplace-feedback-web:${TAG}
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://api:8000
    # ホストにポートを出さない。外部へは cloudflared から feedback:3000 として渡す
    expose:
      - "3000"
    networks:
      - default
      - gpa_default
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    # イメージに curl は無いので node の fetch で確かめる
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # 引用符で囲む。`? 0 : 1` の ": " があると YAML がマッピングとして読んでしまう
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    image: workplace-feedback-api:${TAG}
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://app:app@db:5432/workplace_feedback
    # 鍵はイメージに焼かず、VM 側のファイルから実行時に読む。
    # 置いていなければ未設定のまま起動する（GET /meta が stub: true を返す）
    env_file:
      - path: ./secrets.env
        required: false
    # ホストにもgpa_defaultにも出さない。web からだけ届く
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
    # HEALTHCHECK はイメージ側（backend/Dockerfile）に焼き込み済み

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=workplace_feedback
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d workplace_feedback"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
  gpa_default:
    external: true

volumes:
  db_data:
