name: test

on:
  # PR のブランチへの push は pull_request で走るので、push は main だけにして二重実行を防ぐ
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - run: npx playwright install --with-deps chromium

      # web / api / db を3サービスとも起動してから E2E を流す。
      # api はホストにポートを出さないので、単体の next start ではなく実際に web コンテナを通す。
      # GEMINI_API_KEY は渡さない。api の .env.local が無い CI では未設定のままスタブで動く
      - name: docker compose up (web/api/db)
        run: docker compose up -d --build --wait

      - name: Playwright E2E
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: docker compose down
        if: always()
        run: docker compose down -v

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: workplace_feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d workplace_feedback"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check .

      - run: uv run pytest
        env:
          # 大半のテストは SQLite（aiosqlite）で完結するが（backend/ARCHITECTURE.md）、
          # DATABASE_URL を読むテスト・起動経路のために services の postgres も渡しておく
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/workplace_feedback
