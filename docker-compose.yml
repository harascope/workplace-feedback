services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # ソースをホストと同期してホットリロードを効かせる
      - .:/app
      # コンテナ内の node_modules をホストのものと分離する
      # （OS が違うとネイティブ依存が壊れるため）
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
    # ANTHROPIC_API_KEY はここで渡さない。
    # 上のボリュームマウントで .env.local がコンテナ内にも見えるので、
    # Next.js が自分で読み込む（ローカル実行時と同じ挙動）。
    # ここで空文字を渡すと、実プロセスの環境変数が .env.local より優先され、
    # キーを入れてもスタブのままになる。
    # -H 0.0.0.0 が無いと 127.0.0.1 にしかバインドされず、
    # ホストから localhost:3000 でアクセスできなくなる
    command: npx next dev -H 0.0.0.0

volumes:
  node_modules:
  next_cache:
